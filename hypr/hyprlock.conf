# -------------------------
# Background
# -------------------------
background {
    monitor = eDP-1
    path = ~/.config/backgrounds/wallpaper14.jpg
    blur_passes = 3
    blur_size = 0
}

# -------------------------
# Clock
# -------------------------
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    
    color = rgba(cbdff7ff)

    font_size = 140
    font_family = JetBrainsMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}

# -------------------------
# Date
# -------------------------
label {
    monitor = eDP-1
    text = cmd[update:60000] echo "$(date '+%a, %d %B')"

    color = rgba(cbdff7ff)

    font_size = 38
    font_family = JetBrainsMono Nerd Font

    position = 0, 0
    halign = center
    valign = center
}

# -------------------------
# Password
# -------------------------
input-field {
    monitor = eDP-1

    size = 320, 55
    rounding = 25
    outline_thickness = 6

    dots_size = 0.40
    dots_spacing = 0.5
    dots_center = true

    outer_color = rgba(99c1f1ff)
    inner_color = rgba(5e5c64aa)
    font_color = rgba(99c1f1ff)

    fade_on_empty = false
    hide_input = false

    check_color = rgba(99c1f1ff)
    fail_color = rgba(f7796cff)

    # placeholder_text = <i>Password...</i>
    # fail_text = <i>$FAIL <b>($ATTEMPTS attempts)</b></i>

    capslock_color = rgba(f7796cff)

    position = 0, -150
    halign = center
    valign = center
}
